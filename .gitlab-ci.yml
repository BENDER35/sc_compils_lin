stages:
  - mirror

# Sincroniza TODAS las ramas y tags de GitLab a GitHub.
# El push resultante en GitHub dispara .github/workflows/mirror.yml, que
# vuelve a GitLab con 'ci.skip'. Eso rompe el bucle: no hay ciclo infinito.

mirror_a_github:
  stage: mirror
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # GitLab no crea pipelines al borrar ramas: esta scheduler las propaga.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache git openssh-client bash coreutils
    - install -d -m 700 "${HOME}/.ssh"
    - printf '%s' "$MIRROR_SSH_KEY_B64" | base64 -d > "${HOME}/.ssh/mirror_ed25519"
    - chmod 600 "${HOME}/.ssh/mirror_ed25519"
    - ssh-keyscan -H github.com >> "${HOME}/.ssh/known_hosts"
    - export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/mirror_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
  script:
    - TARGET_URL="git@github.com:BENDER35/sc_compils_lin.git" bash scripts/sync_to_github.sh
